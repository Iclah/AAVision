# Conda environment for the AAVision container.
# Single source of truth for all dependencies — bioinformatics tools and
# Python libraries alike. Versions are pinned to the validated environment
# so the image reproduces the published results.
#
# Built into the container's `base` environment via micromamba (see the
# Dockerfile). Channels are ordered conda-forge first, then bioconda, per
# the bioconda recommendation.
name: base
channels:
  - conda-forge
  - bioconda
dependencies:
  # Bioinformatics tools
  - minimap2=2.31
  - samtools=1.23.1
  - seqkit=2.13.0
  - kraken2=2.17.1
  - bracken=3.1
  # procps-ng provides `ps`, which Nextflow calls inside the container to
  # collect per-task metrics. The micromamba base image is minimal and does not
  # ship it, so without this the tasks fail with
  #   "Command 'ps' required by nextflow to collect task metrics cannot be found"
  - procps-ng
  # Python and libraries
  # NOTE: confirm the Python minor version of the validated image with
  #   docker run --rm aavision:dev python --version
  # and pin it here (e.g. python=3.14) so the environment is fully reproducible.
  - python=3.14
  - pysam=0.24.1
  - pandas=3.0.5
  - jinja2=3.1.6
